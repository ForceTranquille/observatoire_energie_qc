[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatoire-energie-qc"
version = "0.1.0"
description = "Collecte, streaming Kafka et analyse énergétique du Québec"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
all = [
  "kafka-python>=2.0,<3",
  "pymongo>=4.6,<5",
  "psycopg[binary]>=3.1,<4",
]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

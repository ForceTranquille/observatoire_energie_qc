services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: observatoire_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16-alpine
    container_name: observatoire_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: energie_qc
      POSTGRES_USER: admin_ia
      POSTGRES_PASSWORD: password_dev
    volumes:
      - pg_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: observatoire_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin_ia
      MONGO_INITDB_ROOT_PASSWORD: password_dev
    volumes:
      - mongo_data:/data/db

volumes:
  pg_data:
  mongo_data:
